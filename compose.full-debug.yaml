name: yt-checker-full-debug

services:
  app:
    build:
      context: .
      target: runtime
    init: true
    env_file:
      - .env
    environment:
      NUXT_ALLOW_DIAGNOSTIC_STORAGE: "true"
      NUXT_LOG_LEVEL: "debug"
      NUXT_LOG_RAW_CANDIDATES: "true"
      NUXT_PUBLIC_DEFAULT_STORAGE_MODE: "diagnostic"
      NUXT_PUBLIC_DEFAULT_TRANSCRIPT_LANGUAGE: "ru"
      NUXT_SCAN_STORAGE_DIR: /data/scans
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./scan-results
        target: /data/scans
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
