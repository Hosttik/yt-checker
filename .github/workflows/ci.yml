name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify inside Docker
        run: docker build --target verify --tag yt-checker:verify .

      - name: Build production image
        run: docker build --target runtime --tag yt-checker:runtime .

      - name: Smoke-test hardened runtime
        run: |
          docker run -d             --name yt-checker-ci             --read-only             --cap-drop ALL             --security-opt no-new-privileges             --tmpfs /tmp:rw,noexec,nosuid,size=64m             yt-checker:runtime

          for attempt in $(seq 1 20); do
            status="$(docker inspect --format='{{.State.Health.Status}}' yt-checker-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs yt-checker-ci
              exit 1
            fi

            sleep 1
          done

          docker logs yt-checker-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f yt-checker-ci >/dev/null 2>&1 || true
