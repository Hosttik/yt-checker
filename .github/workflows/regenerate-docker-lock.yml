name: regenerate-docker-lock

on:
  push:
    branches:
      - review/hardening-openai-transcript

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[docker-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hardening-openai-transcript
          fetch-depth: 0

      - name: Regenerate lock with the exact Docker npm
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            node:22-bookworm-slim \
            sh -lc 'echo "node=$(node --version) npm=$(npm --version)" && rm -rf node_modules package-lock.json && npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund'

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: regenerate lock with Docker npm [docker-lock]"
          git push origin HEAD:review/hardening-openai-transcript
