name: regenerate-cross-platform-lock

on:
  push:
    branches:
      - review/hardening-openai-transcript

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-regenerated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hardening-openai-transcript
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate clean lockfile
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git commit -m "build: regenerate cross-platform lock [lock-regenerated]"
          git push origin HEAD:review/hardening-openai-transcript
