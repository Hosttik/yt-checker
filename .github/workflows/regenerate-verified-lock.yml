name: regenerate-and-verify-lock

on:
  push:
    branches:
      - review/hardening-openai-transcript

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[verified-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hardening-openai-transcript
          fetch-depth: 0

      - name: Regenerate and verify with exact Docker npm
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            node:22-bookworm-slim \
            sh -lc 'set -eux; echo "node=$(node --version) npm=$(npm --version)"; rm -rf node_modules package-lock.json; npm install --include=optional --ignore-scripts --no-audit --no-fund; rm -rf node_modules; npm ci --include=optional --ignore-scripts --no-audit --no-fund'

      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: regenerate and verify lock [verified-lock]"
          git push origin HEAD:review/hardening-openai-transcript
